<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Wire Part 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
  /* layout: one-screen viewer, part header band on top, 3D canvas fills the middle, forming table folds at the bottom */
  :root {
    --hdr:#0B2A5B; --hdr-ink:#ffffff; --head:#0B2A5B; --ink:#1f2937; --grey:#64708a; --line:#d6dbe4;
    --bg:#eef2f8; --card:#ffffff; --view1:#dfe7f4; --view2:#fbfcfe; --btn:#ffffffeb; --row:#edf0f5;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --hdr:#0B2A5B; --hdr-ink:#ffffff; --head:#9cc0f5; --ink:#e5e9f0; --grey:#9aa6bb; --line:#2c3648;
    --bg:#121821; --card:#18202c; --view1:#1b2534; --view2:#0f141c; --btn:#1f2a3aeb; --row:#232d3d; color-scheme: dark } }
  :root[data-theme="dark"] {
    --hdr:#0B2A5B; --hdr-ink:#ffffff; --head:#9cc0f5; --ink:#e5e9f0; --grey:#9aa6bb; --line:#2c3648;
    --bg:#121821; --card:#18202c; --view1:#1b2534; --view2:#0f141c; --btn:#1f2a3aeb; --row:#232d3d; color-scheme: dark }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, "Segoe UI", Tahoma, "Noto Sans Thai", sans-serif; -webkit-text-size-adjust:100%; }
  #app { display:flex; flex-direction:column; height:100%; }
  .pad { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  header { background:var(--hdr); color:var(--hdr-ink); padding-block:10px; }
  header .lbl { font-size:11px; opacity:.75; letter-spacing:.06em; }
  header .pn { font-size:20px; font-weight:700; word-break:break-all; line-height:1.2; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding-block:10px; background:var(--card); border-bottom:1px solid var(--line); }
  .chip { background:var(--bg); border-radius:8px; padding:5px 9px; font-size:13px; font-variant-numeric:tabular-nums; }
  .chip b { color:var(--head); }
  #view { position:relative; flex:1; min-height:260px; background:linear-gradient(var(--view1), var(--view2)); touch-action:none; }
  #view canvas { display:block; position:absolute; inset:0; width:100%; height:100%; }
  .tools { position:absolute; right:max(10px, env(safe-area-inset-right, 0px)); bottom:10px; display:flex; gap:8px; }
  .tools button { border:1px solid var(--line); background:var(--btn); color:var(--head); border-radius:10px;
    padding:8px 12px; font-size:13px; font-weight:600; font-family:inherit; }
  .tools button:focus-visible { outline:2px solid var(--head); outline-offset:2px; }
  .hint { position:absolute; left:max(12px, env(safe-area-inset-left, 0px)); bottom:14px; font-size:11px; color:var(--grey); }
  details { background:var(--card); border-top:1px solid var(--line); max-height:38vh; overflow:auto; }
  summary { padding-block:11px; font-weight:700; color:var(--head); font-size:14px; cursor:pointer; }
  .tbl { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 16px; border-top:1px solid var(--row); }
  th { color:var(--grey); font-weight:600; font-size:12px; }
  td.n { color:var(--grey); width:40px; }
  .msg { padding:40px 24px; text-align:center; color:var(--grey); line-height:1.6; }
  .msg h1 { color:var(--head); font-size:20px; }
  .note { font-size:11px; color:var(--grey); padding-block:8px 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ข้อมูลรูปทรงอยู่หลัง # ของลิงก์ (ไม่ถูกส่งไปที่เซิร์ฟเวอร์) กติกาการดัดเดียวกับไฟล์ .wire */
var shownHash = null;
function main() {
  shownHash = location.hash || "";
  var app = document.getElementById("app");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function fmt(x, nd) { return (+x).toFixed(nd).replace(/\.?0+$/, ""); }

  var raw = (location.hash || "").replace(/^#/, "");
  var data = { dia: 0, name: "", weight: null, ops: [], spring: null };
  var w3 = /^w3/.test(raw);
  if (/^w2-/.test(raw) || w3) {
    // v2: w2-d<Øx100>-g<gx100>-n<PN>-S<Lx100>-B<deg x10>-R<Rx100>-T<roll x10>  (m = ค่าลบ)
    // v3: ไม่มีขีดคั่น ตัวอักษรนำหน้าตัวเลข  S,R,r x10  T เป็นองศาเต็ม  n<PN> อยู่ท้ายสุด ('-' = '_', ' ' = '~', '_' = '.')
    var SC = w3 ? { S: 10, R: 10, r: 10, T: 1 } : { S: 100, R: 100, r: 100, T: 10 };
    var toks = [];
    if (w3) {
      var body = raw.slice(2), ni = body.indexOf("n");
      if (ni >= 0) {
        try { data.name = decodeURIComponent(body.slice(ni + 1).replace(/_/g, "-").replace(/~/g, " ").replace(/\./g, "_")); }
        catch (e) { data.name = body.slice(ni + 1); }
        body = body.slice(0, ni);
      }
      body.replace(/([A-Za-z])(m?\d+)/g, function (_, k, v) { toks.push([k, v]); return ""; });
    } else {
      raw.split("-").forEach(function (it) { toks.push([it.charAt(0), it.slice(1)]); });
    }
    toks.forEach(function (kv) {
      var k = kv[0], v = kv[1];
      var num = function (sc) { return (v.charAt(0) === "m" ? -1 : 1) * parseInt(v.replace(/^m/, ""), 10) / sc; };
      if (k === "d") data.dia = num(100);
      else if (k === "g") data.weight = num(100);
      else if (k === "n") { try { data.name = decodeURIComponent(v.replace(/_/g, "-").replace(/~/g, " ")); } catch (e) { data.name = v; } }
      else if (k === "r") data.rdef = num(SC.r);
      else if (k === "N") { try { data.name = decodeURIComponent(v.replace(/(..)/g, "%$1")); } catch (e) { data.name = ""; } }
      else if (k === "V") { data.vcur = num(1); data.eops = data.eops || { 1: [], 2: [] }; }
      else if (data.vcur && "SBRT".indexOf(k) >= 0) {        // ลำดับดัดของปลายสปริง (ฟุก / ขา / หาง)
        var lst = data.eops[data.vcur];
        if (k === "S") lst.push({ t: "S", L: num(SC.S) });
        else if (k === "B") lst.push({ t: "B", ang: num(10), R: 0, roll: 0 });
        else if (k === "R" && lst.length) lst[lst.length - 1].R = num(SC.R);
        else if (k === "T" && lst.length) lst[lst.length - 1].roll = num(SC.T);
      }
      else if (k === "S") data.ops.push({ t: "S", L: num(SC.S) });
      else if (k === "B") data.ops.push({ t: "B", ang: num(10), R: data.rdef || 0, roll: 0 });
      else if (k === "R" && data.ops.length) data.ops[data.ops.length - 1].R = num(SC.R);
      else if (k === "T" && data.ops.length) data.ops[data.ops.length - 1].roll = num(SC.T);
      // สปริง: Y ชนิด(1 กด 2 ดึง 3 บิด) O โตนอก C จำนวนขด F ความยาวอิสระ E ปลาย H ห่วง X ยืดห่วง P/Q ขา L ซ้าย W ความยาวลวด
      else if ("YOCFEHXPQLW".indexOf(k) >= 0) {
        data.spring = data.spring || {};
        data.spring[k] = num(({ O: 100, C: 100, F: 100, X: 100, P: 100, Q: 100, W: 100 })[k] || 1);
      }
    });
  } else {
    var frag = ""; try { frag = decodeURIComponent(raw); } catch (e) {}
    (frag ? frag.split("~") : []).forEach(function (it) {
      var k = it.charAt(0), v = it.slice(1);
      if (k === "d") data.dia = parseFloat(v);
      else if (k === "n") data.name = v;
      else if (k === "w") data.weight = parseFloat(v);
      else if (k === "S") data.ops.push({ t: "S", L: parseFloat(v) });
      else if (k === "B") { var a = v.split(",").map(parseFloat); data.ops.push({ t: "B", ang: a[0], R: a[1], roll: a[2] || 0 }); }
    });
  }
  if (!data.dia || (!data.ops.length && !(data.spring && data.spring.Y))) {
    app.innerHTML = '<div class="msg"><h1>Wire Part 3D</h1>Scan the QR code on a part report to view the part in 3D.<br>' +
      'สแกน QR บนรายงานชิ้นงานเพื่อดูภาพ 3 มิติ<div style="margin-top:18px;font-size:11px;opacity:.7">link data: ' +
      raw.length + ' chars' + (raw ? ' (' + esc(raw.slice(0, 24)) + '...)' : '') + '</div></div>';
    return;
  }

  // ---------- เวกเตอร์ ----------
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function mul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { var l = Math.sqrt(dot(a, a)) || 1; return mul(a, 1 / l); }
  function rot(v, k, ang) {           // หมุน v รอบแกน k (Rodrigues)
    k = norm(k); var c = Math.cos(ang), s = Math.sin(ang);
    return add(add(mul(v, c), mul(cross(k, v), s)), mul(k, dot(k, v) * (1 - c)));
  }

  // ปลายสปริงจากลำดับดัด (กติกาเดียวกับ spring_calc._Turtle): เริ่มที่ปลายขด ทิศสัมผัส, ระนาบอ้างอิง = แกนสปริงชี้ออก
  function endTurtle(P, atEnd, axisOut, ops) {
    var p = atEnd ? P[P.length - 1] : P[0], t = norm(atEnd ? sub(P[P.length - 1], P[P.length - 2]) : sub(P[0], P[1]));
    var b = norm(sub(axisOut, mul(t, dot(axisOut, t)))), out = [];
    (ops || []).forEach(function (op) {
      if (op.t === "S") { p = add(p, mul(t, op.L)); out.push(p); return; }
      b = rot(b, t, op.roll * Math.PI / 180);
      var cen = add(p, mul(cross(b, t), op.R)), th = op.ang * Math.PI / 180, r0 = sub(p, cen);
      var steps = Math.max(6, Math.ceil(op.ang / 5));
      for (var k = 1; k <= steps; k++) out.push(add(cen, rot(r0, b, th * k / steps)));
      p = out[out.length - 1]; t = norm(rot(t, b, th));
    });
    return out;
  }
  function withEnds(P) {
    if (!data.eops) return null;
    var e0 = endTurtle(P, false, [0, 0, -1], data.eops[1]), e1 = endTurtle(P, true, [0, 0, 1], data.eops[2]);
    return e0.slice().reverse().concat(P, e1);
  }

  var pts, total = 0, bends = 0, rows, title, chip4, clipH = null;
  if (data.spring && data.spring.Y) {
    // ---------- สปริง: สร้างรูปทรงจากตัวเลข (กติกาเดียวกับ spring_calc.py) ----------
    var sp = data.spring, d = data.dia, od = sp.O, dm = od - d, Rr = dm / 2, hand = sp.L ? -1 : 1;
    var pitchHelix = function (segs, perTurn) {
      perTurn = perTurn || 40;
      var tot = 0; segs.forEach(function (q) { tot += q[0]; });
      var n = Math.max(2, Math.ceil(tot * perTurn) + 1), edges = [0], out = [], z = 0, prevP = null, prevU = 0;
      segs.forEach(function (q) { edges.push(edges[edges.length - 1] + q[0]); });
      for (var i = 0; i < n; i++) {
        var u = tot * i / (n - 1), pch = segs[0][1];
        for (var k = 1; k < segs.length; k++) {
          var s0 = Math.min(1, Math.max(0, (u - (edges[k] - 0.25)) / 0.5)); s0 = s0 * s0 * (3 - 2 * s0);
          pch += (segs[k][1] - segs[k - 1][1]) * s0;
        }
        if (prevP !== null) z += (pch + prevP) / 2 * (u - prevU);
        prevP = pch; prevU = u;
        var th = 2 * Math.PI * u * hand;
        out.push([Rr * Math.cos(th), Rr * Math.sin(th), z]);
      }
      return out;
    };
    var Y = sp.Y, nC = sp.C, info = [["Outer / Inner / Mean dia.", fmt(od, 2) + " / " + fmt(od - 2 * d, 2) + " / " + fmt(dm, 2) + " mm"],
                                     ["Direction", sp.L ? "Left hand" : "Right hand"]];
    if (Y === 1) {
      var ends = ["closed_ground", "closed", "open", "open_ground", "closed", "closed"][sp.E || 0], lf = sp.F, na, extra = 0;
      if (ends === "closed_ground") { na = nC - 2; extra = 2 * d; } else if (ends === "closed") { na = nC - 2; extra = 3 * d; }
      else if (ends === "open_ground") { na = nC - 1; } else { na = nC; extra = d; }
      var pitch = ends === "open_ground" ? lf / nC : ends === "open" ? (lf - d) / nC : (lf - extra) / na;
      if (!(pitch >= d)) pitch = d;
      var segs = ends.indexOf("closed") === 0 ? [[1, d], [na, pitch], [1, d]] : [[nC, pitch]];
      pts = pitchHelix(segs);
      // ความสูงแนวกึ่งกลาง: เจียร = Free length (ตัดผิวเจียรที่แนวกึ่งกลางของขดปลาย), ไม่เจียร = Free length - d
      var ground = /ground/.test(ends), Hc = ground ? lf : lf - d;
      var z0 = pts[0][2], h = pts[pts.length - 1][2] - z0;
      if (h > 0) pts = pts.map(function (q) { return [q[0], q[1], (q[2] - z0) * Hc / h]; });
      if (ground) clipH = Hc;
      pts = withEnds(pts) || pts;
      title = "Compression spring";
      info.push(["Total / Active coils", fmt(nC, 2) + " / " + fmt(na, 2)], ["Free length / Pitch", fmt(lf, 2) + " / " + fmt(pitch, 2) + " mm"],
                ["Ends", ["Closed & ground", "Closed, not ground", "Open", "Open & ground", "Pigtail", "Tangent tail"][sp.E || 0]]);
    } else if (Y === 2) {
      var helix = pitchHelix([[nC, d]]), hk = ["full_loop", "half_loop", "extended"][sp.H || 0], ext = sp.X || 0;
      var loop = function (P, rh, up) {
        var rise = Rr + (hk === "extended" ? ext : 0), P2 = add(P, mul(up, rise)), c = sub(P2, mul(rh, Rr));
        var span = hk === "half_loop" ? Math.PI : 2 * Math.PI, m = span > 4 ? 40 : 20, o = [P];
        for (var i = 1; i <= 5; i++) o.push(add(P, mul(sub(P2, P), i / 5)));
        for (var j = 1; j <= m; j++) { var a = span * j / m; o.push(add(c, add(mul(rh, Rr * Math.cos(a)), mul(up, Rr * Math.sin(a))))); }
        return o;
      };
      var p0 = helix[0], p1 = helix[helix.length - 1];
      var h0 = loop(p0, [p0[0] / Rr, p0[1] / Rr, 0], [0, 0, -1]), h1 = loop(p1, [p1[0] / Rr, p1[1] / Rr, 0], [0, 0, 1]);
      pts = withEnds(helix) || h0.slice().reverse().concat(helix.slice(1, -1), h1);
      title = "Extension spring";
      info.push(["Body coils", fmt(nC, 2)], ["Hooks", data.eops ? "see 3D" : ["Full loop (machine hook)", "Half loop", "Extended loop +" + fmt(ext, 2) + " mm"][sp.H || 0]]);
    } else {
      var hx = pitchHelix([[nC, d]]), L1 = sp.P || 0, L2 = sp.Q || 0;
      var t0 = norm(sub(hx[1], hx[0])), t1 = norm(sub(hx[hx.length - 1], hx[hx.length - 2]));
      pts = withEnds(hx) || (L1 > 0 ? [sub(hx[0], mul(t0, L1))] : []).concat(hx, L2 > 0 ? [add(hx[hx.length - 1], mul(t1, L2))] : []);
      title = "Torsion spring";
      info.push(["Body coils", fmt(nC, 2)], ["Leg 1 / Leg 2", fmt(L1, 2) + " / " + fmt(L2, 2) + " mm"],
                ["Angle between legs (free)", fmt((nC % 1) * 360, 0) + "&deg;"]);
    }
    // แนวยาวเป็นจุดถี่: ขาที่เป็นเส้นตรงยาวเติมจุดให้ท่อเรียบ
    var dense = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var seg = sub(pts[i], pts[i - 1]), L = Math.sqrt(dot(seg, seg)), m = Math.max(1, Math.ceil(L / (d * 2)));
      for (var j = 1; j <= m; j++) dense.push(add(pts[i - 1], mul(seg, j / m)));
    }
    pts = dense;
    total = sp.W || 0;
    chip4 = '<span class="chip">Coils <b>' + fmt(nC, 2) + '</b></span>';
    rows = { head: "Specification (" + title + ")", html: '<tr><th>Item</th><th>Value</th></tr>' +
      info.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("") };
  } else {
    // ---------- turtle: แนวกึ่งกลางลวด (กติกาเดียวกับไฟล์ .wire) ----------
    var p = [0, 0, 0], t = [1, 0, 0], b = [0, 0, 1];
    pts = [p];
    data.ops.forEach(function (op) {
      if (op.t === "S") {
        var n = Math.max(1, Math.ceil(op.L / (data.dia * 2)));
        for (var i = 1; i <= n; i++) pts.push(add(p, mul(t, op.L * i / n)));
        p = add(p, mul(t, op.L)); total += op.L;
      } else {
        b = rot(b, t, op.roll * Math.PI / 180);
        var cen = add(p, mul(cross(b, t), op.R)), th = op.ang * Math.PI / 180;
        var steps = Math.max(6, Math.ceil(op.ang / 5)), r0 = sub(p, cen);
        for (var k = 1; k <= steps; k++) pts.push(add(cen, rot(r0, b, th * k / steps)));
        p = pts[pts.length - 1]; t = norm(rot(t, b, th));
        total += op.R * th; bends++;
      }
    });
    chip4 = '<span class="chip">Bends <b>' + bends + '</b></span>';
    rows = { head: "Forming sequence (" + data.ops.length + ")", html: "<tr><th>#</th><th>Element</th><th>Length / Angle</th></tr>" +
      data.ops.map(function (op, i) {
        return "<tr><td class='n'>" + (i + 1) + "</td><td>" + (op.t === "S" ? "Straight" : "Bend") + "</td><td>" +
          (op.t === "S" ? fmt(op.L, 2) + " mm" : fmt(op.ang, 1) + "&deg; (R" + fmt(op.R, 2) + ")" +
            (op.roll ? " &nbsp;<span style='color:#6b7280'>rot " + fmt(op.roll, 1) + "&deg;</span>" : "")) + "</td></tr>";
      }).join("") };
  }
  var w = data.weight;

  // ---------- หน้าจอ ----------
  app.innerHTML =
    '<header class="pad"><div class="lbl">PART NO</div><div class="pn">' + esc(data.name || "-") + '</div></header>' +
    '<div class="chips pad"><span class="chip">Wire <b>&Oslash;' + fmt(data.dia, 2) + ' mm</b></span>' +
    (total ? '<span class="chip">Length <b>' + fmt(total, 2) + ' mm</b></span>' : "") +
    (w != null ? '<span class="chip">Weight <b>' + fmt(w, 2) + ' g</b></span>' : "") + chip4 + '</div>' +
    '<div id="view"><canvas id="cv"></canvas><div class="hint">Drag to rotate &middot; pinch to zoom</div>' +
    '<div class="tools"><button id="spin">Auto-rotate</button><button id="reset">Reset</button></div></div>' +
    '<details><summary class="pad">' + rows.head + '</summary><div class="tbl"><table>' +
    rows.html + '</table></div><div class="note pad">Data comes from the link in the QR code and stays on this phone. ' +
    'ข้อมูลอยู่ในลิงก์ของ QR ไม่ได้ส่งไปที่เซิร์ฟเวอร์</div></details>';

  var view = document.getElementById("view"), cv = document.getElementById("cv");
  var gl = cv.getContext("webgl", { antialias: true, alpha: true, premultipliedAlpha: false });
  if (!gl) { view.innerHTML = '<div class="msg">This browser cannot show 3D (WebGL is off).</div>'; return; }

  // ---------- ตาข่ายท่อ (parallel transport) ----------
  var N = pts.length, r = data.dia / 2;
  var sides = N * 20 > 60000 ? 12 : 20;
  var mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  pts.forEach(function (q) { for (var k = 0; k < 3; k++) { mn[k] = Math.min(mn[k], q[k]); mx[k] = Math.max(mx[k], q[k]); } });
  var ctr = mul(add(mn, mx), 0.5);
  var rad = Math.sqrt(dot(sub(mx, mn), sub(mx, mn))) / 2 + r || 10;
  var T = [];
  for (var i = 0; i < N; i++) T.push(norm(sub(pts[Math.min(N - 1, i + 1)], pts[Math.max(0, i - 1)])));
  var Nn = [norm(cross(T[0], Math.abs(T[0][2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]))];
  for (var i = 1; i < N; i++) {
    var q = sub(Nn[i - 1], mul(T[i], dot(Nn[i - 1], T[i])));
    Nn.push(dot(q, q) > 1e-12 ? norm(q) : Nn[i - 1]);
  }
  var pos = [], nor = [], idx = [];
  for (var i = 0; i < N; i++) {
    var B = cross(T[i], Nn[i]), c0 = sub(pts[i], ctr);
    for (var j = 0; j < sides; j++) {
      var ph = 2 * Math.PI * j / sides, d = add(mul(Nn[i], Math.cos(ph)), mul(B, Math.sin(ph)));
      pos.push(c0[0] + r * d[0], c0[1] + r * d[1], c0[2] + r * d[2]); nor.push(d[0], d[1], d[2]);
    }
  }
  for (var i = 0; i < N - 1; i++) for (var j = 0; j < sides; j++) {
    var a1 = i * sides + j, b1 = i * sides + (j + 1) % sides;
    idx.push(a1, a1 + sides, b1, b1, a1 + sides, b1 + sides);
  }
  [[0, -1], [N - 1, 1]].forEach(function (e) {        // ฝาปิดปลายลวด
    var i = e[0], nn = mul(T[i], e[1]), base = pos.length / 3, c0 = sub(pts[i], ctr);
    pos.push(c0[0], c0[1], c0[2]); nor.push(nn[0], nn[1], nn[2]);
    for (var j = 0; j < sides; j++) {
      var k = i * sides + j;
      pos.push(pos[k * 3], pos[k * 3 + 1], pos[k * 3 + 2]); nor.push(nn[0], nn[1], nn[2]);
    }
    for (var j = 0; j < sides; j++) idx.push(base, base + 1 + j, base + 1 + (j + 1) % sides);
  });
  var big = pos.length / 3 > 65535;
  if (big && !gl.getExtension("OES_element_index_uint")) { view.innerHTML = '<div class="msg">Model too large for this phone.</div>'; return; }

  // ---------- WebGL ----------
  function shader(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER,
    "attribute vec3 aP; attribute vec3 aN; uniform mat4 uM; uniform mat4 uP; varying vec3 vN; varying vec3 vV; varying float vZ;" +
    "void main(){ vec4 v = uM * vec4(aP,1.0); vN = mat3(uM) * aN; vV = -v.xyz; vZ = aP.z; gl_Position = uP * v; }"));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER,
    "precision mediump float; varying vec3 vN; varying vec3 vV; varying float vZ;" +
    "uniform float uClip; uniform float uLo; uniform float uHi; uniform vec3 uCapLo; uniform vec3 uCapHi;" +
    "void main(){ if (uClip > 0.5 && (vZ < uLo || vZ > uHi)) discard;" +
    " vec3 n = normalize(vN); vec3 v = normalize(vV); float cap = 0.0;" +
    " if (dot(n,v) < 0.0) { if (uClip > 0.5) { cap = 1.0; n = (vZ - uLo < uHi - vZ) ? uCapLo : uCapHi; } else { n = -n; } }" +
    " vec3 L1 = normalize(vec3(-0.45,0.65,0.62)); vec3 L2 = normalize(vec3(0.6,-0.1,0.5));" +
    " float d = 0.30 + 0.58*max(dot(n,L1),0.0) + 0.20*max(dot(n,L2),0.0) + 0.14*pow(1.0-max(dot(n,v),0.0),2.0);" +
    " float sp = pow(max(dot(n, normalize(L1+v)),0.0), 48.0)*0.55 + pow(max(dot(n, normalize(L2+v)),0.0), 24.0)*0.15;" +
    " vec3 col = vec3(0.78,0.80,0.84)*d + vec3(sp);" +
    " if (cap > 0.5) col = vec3(0.925,0.94,0.97) * (0.55 + 0.45*abs(n.z));" +
    " gl_FragColor = vec4(min(col,vec3(1.0)),1.0); }"));
  gl.linkProgram(prog); gl.useProgram(prog);
  function buf(target, arr) { var bb = gl.createBuffer(); gl.bindBuffer(target, bb); gl.bufferData(target, arr, gl.STATIC_DRAW); return bb; }
  buf(gl.ARRAY_BUFFER, new Float32Array(pos));
  var aP = gl.getAttribLocation(prog, "aP"); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
  buf(gl.ARRAY_BUFFER, new Float32Array(nor));
  var aN = gl.getAttribLocation(prog, "aN"); gl.enableVertexAttribArray(aN); gl.vertexAttribPointer(aN, 3, gl.FLOAT, false, 0, 0);
  buf(gl.ELEMENT_ARRAY_BUFFER, big ? new Uint32Array(idx) : new Uint16Array(idx));
  var uM = gl.getUniformLocation(prog, "uM"), uP = gl.getUniformLocation(prog, "uP");
  var uClip = gl.getUniformLocation(prog, "uClip"), uLo = gl.getUniformLocation(prog, "uLo"), uHi = gl.getUniformLocation(prog, "uHi");
  var uCapLo = gl.getUniformLocation(prog, "uCapLo"), uCapHi = gl.getUniformLocation(prog, "uCapHi");
  gl.uniform1f(uClip, clipH !== null ? 1 : 0);
  if (clipH !== null) { gl.uniform1f(uLo, 0 - ctr[2]); gl.uniform1f(uHi, clipH - ctr[2]); }
  gl.enable(gl.DEPTH_TEST); gl.clearColor(0, 0, 0, 0);

  // ---------- กล้อง / หมุน / ซูม ----------
  var R3, zoom, spin = false;
  function axisRot(ax, a) {
    var c = Math.cos(a), s = Math.sin(a), x = ax[0], y = ax[1], z = ax[2], C = 1 - c;
    return [x*x*C+c, x*y*C-z*s, x*z*C+y*s, y*x*C+z*s, y*y*C+c, y*z*C-x*s, z*x*C-y*s, z*y*C+x*s, z*z*C+c];
  }
  function m3(a, b) {
    var o = [];
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) o.push(a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]);
    return o;
  }
  function home() {       // สปริงปลายเจียร: เอียงให้เห็นหน้าเจียร
    R3 = clipH !== null ? m3(axisRot([1, 0, 0], -0.95), axisRot([0, 0, 1], 0.5)) : m3(axisRot([1, 0, 0], 0.45), axisRot([0, 1, 0], -0.6));
    zoom = 1;
  }
  home();
  function draw() {
    var W = cv.width, H = cv.height;
    gl.viewport(0, 0, W, H); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    var fov = 30 * Math.PI / 180, asp = W / H;
    var fit = asp < 1 ? Math.atan(Math.tan(fov / 2) * asp) : fov / 2;
    var dist = rad / Math.sin(fit) * 1.05 / zoom;
    var f = 1 / Math.tan(fov / 2), nr = Math.max(dist - rad * 2, dist / 100), fr = dist + rad * 2;
    gl.uniformMatrix4fv(uP, false, [f / asp, 0, 0, 0, 0, f, 0, 0, 0, 0, (fr + nr) / (nr - fr), -1, 0, 0, 2 * fr * nr / (nr - fr), 0]);
    var R = R3;
    gl.uniformMatrix4fv(uM, false, [R[0], R[3], R[6], 0, R[1], R[4], R[7], 0, R[2], R[5], R[8], 0, 0, 0, -dist, 1]);
    gl.uniform3f(uCapLo, -R[2], -R[5], -R[8]); gl.uniform3f(uCapHi, R[2], R[5], R[8]);
    gl.drawElements(gl.TRIANGLES, idx.length, big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(view.clientWidth * dpr)); cv.height = Math.max(1, Math.round(view.clientHeight * dpr));
    draw();
  }
  function turn(dx, dy) {
    var k = 3.2 / Math.max(160, Math.min(view.clientWidth, view.clientHeight));
    R3 = m3(axisRot([1, 0, 0], dy * k), m3(axisRot([0, 1, 0], dx * k), R3));
  }
  var ptrs = {}, lastPinch = 0;
  cv.addEventListener("pointerdown", function (e) { cv.setPointerCapture(e.pointerId); ptrs[e.pointerId] = [e.clientX, e.clientY]; lastPinch = 0; });
  cv.addEventListener("pointermove", function (e) {
    if (!ptrs[e.pointerId]) return;
    var ids = Object.keys(ptrs);
    if (ids.length === 1) { turn(e.clientX - ptrs[e.pointerId][0], e.clientY - ptrs[e.pointerId][1]); }
    ptrs[e.pointerId] = [e.clientX, e.clientY];
    if (ids.length >= 2) {
      var a = ptrs[ids[0]], c = ptrs[ids[1]], d = Math.hypot(a[0] - c[0], a[1] - c[1]);
      if (lastPinch) zoom = Math.min(20, Math.max(0.3, zoom * d / lastPinch));
      lastPinch = d;
    }
    draw();
  });
  function up(e) { delete ptrs[e.pointerId]; lastPinch = 0; }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", function (e) { e.preventDefault(); zoom = Math.min(20, Math.max(0.3, zoom * Math.exp(-e.deltaY * 0.0015))); draw(); }, { passive: false });
  cv.addEventListener("dblclick", function () { home(); draw(); });
  window.addEventListener("resize", resize);
  document.getElementById("reset").onclick = function () { home(); draw(); };
  var spinBtn = document.getElementById("spin");
  spinBtn.onclick = function () { spin = !spin; spinBtn.textContent = spin ? "Stop" : "Auto-rotate"; if (spin) loop(); };
  function loop() { if (!spin) return; R3 = m3(axisRot([0, 1, 0], 0.012), R3); draw(); requestAnimationFrame(loop); }
  resize();
}
main();
// ลิงก์บน claude.ai อาจส่ง # มาให้หลังหน้าเว็บโหลดแล้ว: คอยดูการเปลี่ยนแปลงแล้ววาดใหม่
window.addEventListener("hashchange", function () { if ((location.hash || "") !== shownHash) main(); });
var tries = 0, poll = setInterval(function () {
  if ((location.hash || "") !== shownHash) main();
  if (++tries > 40) clearInterval(poll);
}, 250);
</script>
